name: refresh stats

# 프로필의 "RESEARCH AT A GLANCE" 패널을 다시 만든다.
# 지식그래프·Hugging Face 는 공개 API 라 비밀값이 필요 없다.
# W&B 만 WANDB_API_KEY 시크릿을 쓰고, 없으면 마지막으로 성공한 값을 그대로 둔다
# (assets/stats.json 에 보관) — 패널이 비어 보이지 않게 하려는 것이다.

on:
  schedule:
    - cron: "17 3 * * *"      # 매일 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - tools/build_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 통계 생성
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: python3 tools/build_stats.py

      - name: 바뀐 것이 있으면 커밋
        run: |
          set -eu
          if git diff --quiet -- assets/research-stats.svg assets/stats.json; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-stats.svg assets/stats.json
          git commit -m "통계 패널 갱신 — $(date -u +%Y-%m-%d)"
          git push
